<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turon Telecom - Yunusobod Abonentlari</title>
    <!-- SheetJS kutubxonasi Excel faylini o'qish uchun -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d82;
            --success: #00a651;
            --success-dark: #00823e;
            --alif: #5b2d90;
            --alif-dark: #452170;
            --warning: #ffc107;
            --warning-dark: #e0a800;
            --info: #17a2b8;
            --bg: #f4f6f9;
            --card-bg: #fff;
            --text: #333;
            --text-secondary: #666;
            --border: #ddd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        p.subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 15px; }
        .search-box { width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 15px; outline: none; transition: border-color 0.2s; }
        .search-box:focus { border-color: var(--primary); }
        .stats { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; text-align: center; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .name { font-size: 18px; font-weight: bold; color: var(--primary-dark); margin-bottom: 8px; }
        .info-row { font-size: 14px; margin-bottom: 6px; color: var(--text); }
        .info-row span { color: var(--text-secondary); }
        .balance { font-weight: bold; color: #dc3545; }
        
        .login-box { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 8px 12px; border-radius: 6px; border: 1px dashed var(--border); margin: 8px 0; }
        .login-text { font-weight: bold; color: var(--primary); }
        .btn-copy { background: #6c757d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-copy:hover { background: #5a6268; }

        /* Izoh yozish qismi */
        .comment-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
        .comment-input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; resize: vertical; outline: none; background: #fafafa; }
        .comment-input:focus { border-color: var(--primary); background: #fff; }
        .comment-label { font-size: 12px; font-weight: bold; color: var(--text-secondary); margin-bottom: 4px; display: block; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; color: white; border: none; cursor: pointer; text-align: center; }
        .btn-click { background-color: var(--success); }
        .btn-click:hover { background-color: var(--success-dark); }
        .btn-alif { background-color: var(--alif); }
        .btn-alif:hover { background-color: var(--alif-dark); }
        .btn-map { background-color: var(--warning); color: #000; }
        .btn-map:hover { background-color: var(--warning-dark); }
        .btn-call { background-color: var(--info); }
        .btn-call:hover { background-color: #138496; }
        
        .load-more { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 20px 0; text-align: center; }
        .load-more:hover { background: var(--primary-dark); }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 5px; font-size: 14px; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Turon Telecom</h1>
            <p class="subtitle">Yunusobod tumani abonentlari bazasi</p>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="Ism, login, manzil yoki telefon raqami bo'yicha qidirish..." oninput="filterSubscribers()">
        <div id="stats" class="stats">Excel baza yuklanmoqda...</div>

        <div id="subscribersList"></div>
        <button id="loadMoreBtn" class="load-more" onclick="loadMore()" style="display: none;">Ko'proq yuklash (+50)</button>
    </div>

    <div id="toast" class="toast">Login nusxalandi!</div>

    <script>
        let subscribers = [];
        let filteredSubscribers = [];
        let displayedCount = 20;

        async function loadExcelData() {
            try {
                const response = await fetch('YUNUSOBOD_BARRALIK_YAGONA_TARTIBLANGAN (1).xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                subscribers = XLSX.utils.sheet_to_json(worksheet);
                filteredSubscribers = [...subscribers];
                
                renderSubscribers();
            } catch (error) {
                document.getElementById('stats').innerText = "Xatolik: Excel faylni o'qishda muammo yuzaga keldi!";
                console.error(error);
            }
        }

        function copyLogin(loginText) {
            navigator.clipboard.writeText(loginText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            }).catch(err => {
                console.error('Nusxalashda xatolik:', err);
            });
        }

        // Izohni saqlash funksiyasi
        function saveComment(login, commentText) {
            localStorage.setItem('comment_' + login, commentText);
        }

        function renderSubscribers() {
            const listEl = document.getElementById('subscribersList');
            const statsEl = document.getElementById('stats');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            statsEl.innerText = `Topildi: ${filteredSubscribers.length} ta abonent (Jami bazada: ${subscribers.length} ta)`;
            
            const toDisplay = filteredSubscribers.slice(0, displayedCount);
            
            if (toDisplay.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">Hech qanday abonent topilmadi.</p>';
                loadMoreBtn.style.display = 'none';
                return;
            }

            let html = '';
            toDisplay.forEach(sub => {
                const name = sub['Имя'] || 'Noma\'lum';
                const login = sub['Логин'] || '';
                const address = sub['Адрес'] || '';
                const tariff = sub['Тариф'] || '';
                const balance = sub['Баланс'] !== undefined ? sub['Баланс'] : '';
                const phone = sub['Телефон'] || '';

                // Saqlangan izohni olish
                const savedComment = localStorage.getItem('comment_' + login) || '';

                const clickUrl = `https://my.click.uz/services/pay?service_id=23185`;
                const alifUrl = `https://alifmobi.uz`;
                const mapUrl = `https://yandex.uz/maps/?text=${encodeURIComponent(address)}`;

                html += `
                    <div class="card">
                        <div class="name">${name}</div>
                        <div class="info-row"><span>Manzil:</span> ${address}</div>
                        <div class="info-row"><span>Tarif:</span> ${tariff}</div>
                        <div class="info-row"><span>Balans:</span> <span class="balance">${balance} so'm</span></div>
                        <div class="info-row"><span>Telefon:</span> ${phone}</div>
                        
                        <div class="login-box">
                            <div><span>Login:</span> <strong class="login-text">${login}</strong></div>
                            <button class="btn-copy" onclick="copyLogin('${login}')">📋 Nusxalash</button>
                        </div>

                        <div class="comment-section">
                            <label class="comment-label">💬 Abonent haqida izoh (muomalasi va h.k.):</label>
                            <textarea class="comment-input" placeholder="Masalan: Yaxshi muomala qildi, kechroq to'layman dedi..." oninput="saveComment('${login}', this.value)">${savedComment}</textarea>
                        </div>

                        <div class="btn-group">
                            <a href="${clickUrl}" target="_blank" class="btn btn-click" onclick="copyLogin('${login}')">💳 Click orqali to'lash (Loginni nusxalash)</a>
                            <a href="${alifUrl}" target="_blank" class="btn btn-alif" onclick="copyLogin('${login}')">🟣 Alif Mobi orqali to'lash (Loginni nusxalash)</a>
                            <a href="${mapUrl}" target="_blank" class="btn btn-map">📍 Yandex Maps (Manzil)</a>
                            <a href="tel:${phone}" class="btn btn-call">📞 Qo'ng'iroq qilish</a>
                        </div>
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
            
            if (displayedCount < filteredSubscribers.length) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        function filterSubscribers() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                filteredSubscribers = [...subscribers];
            } else {
                filteredSubscribers = subscribers.filter(sub => {
                    const name = String(sub['Имя'] || '').toLowerCase();
                    const login = String(sub['Логин'] || '').toLowerCase();
                    const address = String(sub['Адрес'] || '').toLowerCase();
                    const phone = String(sub['Телефон'] || '').toLowerCase();
                    return name.includes(query) || login.includes(query) || address.includes(query) || phone.includes(query);
                });
            }
            displayedCount = 20;
            renderSubscribers();
        }

        function loadMore() {
            displayedCount += 50;
            renderSubscribers();
        }

        loadExcelData();
    </script>
</body>
</html>
